version: 1.3.5
cache: true

interface:
  modelSelect: true
  parameters: true
  agents:
    use: true
    create: true
    share: false
    public: false
  fileCitations: true
  skills: true
  defaultPinnedTools:
    - artifacts
    - execute_code
    - file_search
    - skills

# First-time default only; users with an existing model selection keep it.
modelSpecs:
  prioritize: false
  list:
    - name: gemini-3-8-flash-default
      label: Gemini 3.8 Flash
      softDefault: true
      preset:
        endpoint: google
        model: gemini-3.8-flash

endpoints:
  agents:
    disableBuilder: false
    allowedProviders:
      - OpenAI
      - google
      - anthropic
      - xAI
    capabilities:
      - execute_code
      - file_search
      - artifacts
      - skills
      - tools

  google:
    titleConvo: true
    titleModel: gemini-3.5-flash-preview

  anthropic:
    titleConvo: true
    titleModel: claude-sonnet-5

  custom:
    - name: OpenAI
      apiKey: user_provided
      baseURL: https://api.aittco.com/v1
      addParams:
        web_search: true
      models:
        default:
          - gpt-5.6-sol
          - gpt-5.6-terra
          - gpt-5.5
          - gpt-5.4
        fetch: false
      titleConvo: true
      titleModel: gpt-5.6-terra
      modelDisplayLabel: OpenAI

    - name: xAI
      apiKey: user_provided
      baseURL: https://api.aittco.com/v1
      addParams:
        web_search: true
      models:
        default:
          - grok-4.6
          - grok-4.5
        fetch: false
      titleConvo: true
      titleModel: grok-4.5
      modelDisplayLabel: xAI

fileConfig:
  endpoints:
    default:
      fileLimit: 10
      fileSizeLimit: 20
      totalSizeLimit: 100
      supportedMimeTypes:
        - image/.*
        - application/pdf
        - text/.*
        - application/json
        - application/vnd.openxmlformats-officedocument.*
  serverFileSizeLimit: 100
  clientImageResize:
    maxWidth: 1900
    maxHeight: 1900
    quality: 0.92
